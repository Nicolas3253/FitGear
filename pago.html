<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGear | Finalizar Compra</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="pago.css">

</head>
<body>

    <!-- HEADER DE COMPRA -->
    <header class="checkout-header">
        <a href="index.html" class="brand-logo">FIT<span>GEAR</span></a>
        <a href="index.html" class="back-to-shop">
            <i class="fa-solid fa-arrow-left"></i> Volver a la Tienda
        </a>
    </header>

    <main class="checkout-container">
        
        <!-- SECCIÓN IZQUIERDA: FORMULARIOS -->
        <div class="checkout-main">
            
            <!-- DATOS DE ENVÍO -->
            <div class="checkout-box">
                <h2 class="section-title"><i class="fa-solid fa-truck-ramp-box"></i> Datos de Envío</h2>
                <form id="shippingForm" class="form-grid">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" class="form-input" id="checkoutName" required placeholder="Tu Nombre">
                    </div>
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" class="form-input" id="checkoutLastName" required placeholder="Tus Apellidos">
                    </div>
                    <div class="form-group full-width">
                        <label>Correo Electrónico</label>
                        <input type="email" class="form-input" id="checkoutEmail" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="form-group full-width">
                        <label>Dirección de Residencia</label>
                        <input type="text" class="form-input" id="checkoutAddress" required placeholder="Carrera 15 # 10 - 20, Barrio Centenario">
                    </div>
                    <div class="form-group">
                        <label>Departamento / Ciudad</label>
                        <input type="text" class="form-input" id="checkoutCity" required placeholder="Santander / Piedecuesta">
                    </div>
                    <div class="form-group">
                        <label>Teléfono de Contacto</label>
                        <input type="tel" class="form-input" id="checkoutPhone" required placeholder="300 123 4567">
                    </div>
                </form>
            </div>

            <!-- MÉTODOS DE PAGO COLOMBIANOS -->
            <div class="checkout-box">
                <h2 class="section-title"><i class="fa-solid fa-credit-card"></i> Método de Pago</h2>
                <div class="payment-methods">
                    
                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="pay_nequi" value="nequi" checked>
                        <label for="pay_nequi" class="payment-label">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                            <span>Nequi</span>
                        </label>
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="pay_daviplata" value="daviplata">
                        <label for="pay_daviplata" class="payment-label">
                            <i class="fa-solid fa-wallet"></i>
                            <span>Daviplata</span>
                        </label>
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="pay_pse" value="pse">
                        <label for="pay_pse" class="payment-label">
                            <i class="fa-solid fa-building-columns"></i>
                            <span>PSE</span>
                        </label>
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="pay_card" value="card">
                        <label for="pay_card" class="payment-label">
                            <i class="fa-solid fa-credit-card"></i>
                            <span>Tarjeta</span>
                        </label>
                    </div>

                </div>
            </div>

        </div>

        <!-- SECCIÓN DERECHA: RESUMEN DE LA ORDEN -->
        <div class="order-summary">
            <div class="checkout-box">
                <h2 class="section-title"><i class="fa-solid fa-receipt"></i> Resumen de la Orden</h2>
                
                <div class="summary-items" id="summaryItemsContainer">
                    <!-- Productos cargados dinámicamente -->
                </div>

                <div class="cost-breakdown">
                    <div class="cost-row">
                        <span>Subtotal</span>
                        <span id="subtotalVal">$0 COP</span>
                    </div>
                    <div class="cost-row">
                        <span>Envío (Nacional)</span>
                        <span id="shippingVal">$12,000 COP</span>
                    </div>
                    <div class="cost-row total">
                        <span>Total:</span>
                        <span id="totalVal">$0 COP</span>
                    </div>
                </div>

                <button class="btn-pay-now" id="confirmPaymentBtn">
                    <i class="fa-solid fa-lock"></i> Pagar Pedido
                </button>

                <div class="secure-badge">
                    <i class="fa-solid fa-shield-halved"></i> Transacción 100% Encriptada y Segura
                </div>
            </div>
        </div>

    </main>

    <script src="pago.js"> </script>
</body>
</html>
